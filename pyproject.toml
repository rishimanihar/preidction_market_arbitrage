[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "pmarb"
version = "0.1.0"
description = "Local research toolkit for Kalshi and Polymarket US arbitrage."
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "websockets==17.4",
    "cryptography==50.0.2",
    "streamlit==1.67.0",
    # Windows ships no IANA time zone database; zoneinfo reads it from tzdata.
    "tzdata==2026.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[project.scripts]
pmarb = "pmarb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmarb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "localdata: needs private local research dumps; skipped when they are absent",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
